name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      # TEMPORAIRE — à retirer avant le merge.
      # Permet de valider la chaîne verify -> build -> deploy depuis la branche,
      # le workflow ne se déclenchant sinon que sur main.
      - claude/repo-review-recent-changes-d4ey62

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Gate: a merge on main is type-checked, linted and tested before anything is
  # published. Reuses the CI workflow so the checks stay defined in one place.
  verify:
    name: Verify
    uses: ./.github/workflows/ci.yml

  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
