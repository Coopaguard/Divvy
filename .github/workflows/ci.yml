name: CI

on:
  # Every commit pushed on a working branch. `main` is deliberately excluded:
  # its commits are verified by the deploy pipeline, which reuses this workflow
  # (see workflow_call below) instead of running it a second time.
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  # `github.workflow` resolves to the caller's name when this workflow is
  # reused, keeping a deploy verification in its own group so it is never
  # cancelled by an unrelated branch run.
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Type-check, lint and test
    runs-on: ubuntu-latest
    # A pull request opened from a branch of this repository is already covered
    # by that branch's push. Only forks need the pull_request trigger.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run type-check

      - name: Lint
        run: npm run lint:ci

      - name: Unit tests
        run: npm run test
